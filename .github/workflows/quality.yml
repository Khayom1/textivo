name: Textivo quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check sw.js
          node --check scripts/check-project.mjs
      - name: Run repository integrity checks
        run: node scripts/check-project.mjs
      - name: Validate PWA manifest
        run: python -m json.tool manifest.json > /dev/null
